name: glaze_flutter
description: "Astoria — AI chat client (Flutter)"
publish_to: 'none'
version: 0.8.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  drift: ^2.22.1
  sqlite3: ^3.3.2
  sqlite3_flutter_libs: ^0.6.0+eol
  dio: ^5.7.0
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  collection: ^1.18.0
  path: ^1.9.0
  shared_preferences: ^2.3.0
  flutter_secure_storage:
    path: third_party/flutter_secure_storage
  cryptography: ^2.9.0
  gpt_markdown: ^1.1.6
  url_launcher: ^6.3.0
  archive: ^4.0.0
  crypto: ^3.0.0
  image: 4.9.1
  file_picker: ^11.0.2
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.16
  tiktoken: ^1.0.3
  cached_network_image: ^3.4.1
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0
  share_plus: ^12.0.2
  flutter_foreground_task: ^9.2.2
  flutter_local_notifications: ^22.0.0
  app_links: ^7.1.1
  wechat_assets_picker: ^10.1.2
  photo_manager: ^3.10.0
  flex_color_scheme: ^8.4.0
  dynamic_color: ^1.7.0
  flutter_inappwebview: ^6.1.5
  easy_localization: ^3.0.7
  audioplayers: ^6.1.0
  sensors_plus: ^6.1.1
  palette_generator: ^0.3.3+7
  flutter_localizations:
    sdk: flutter
  desktop_drop: ^0.8.3
  pasteboard: ^0.5.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.0
  json_serializable: ^6.8.0
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/logos/providers/
    - assets/presets/
    - assets/hydall.jpg
    - assets/danvitv.png
    - assets/chat_webview/
    - assets/chat_webview/bridge/
    - assets/chat_webview/formatter/
    - assets/chat_webview/renderer/
    - assets/translations/
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf


# BEGIN ASTORIA PINNED SQLITE SOURCE HOOK
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite3_3530100/sqlite3.c
      defines:
        default_options: false
        defines:
          SQLITE_ENABLE_DBSTAT_VTAB: null
          SQLITE_ENABLE_FTS5: null
          SQLITE_ENABLE_RTREE: null
          SQLITE_ENABLE_MATH_FUNCTIONS: null
          SQLITE_DQS: '0'
          SQLITE_DEFAULT_MEMSTATUS: '0'
          SQLITE_TEMP_STORE: '2'
          SQLITE_MAX_EXPR_DEPTH: '0'
          SQLITE_STRICT_SUBTYPE: '1'
          SQLITE_OMIT_AUTHORIZATION: null
          SQLITE_OMIT_DECLTYPE: null
          SQLITE_OMIT_DEPRECATED: null
          SQLITE_OMIT_SHARED_CACHE: null
          SQLITE_OMIT_TCL_VARIABLE: null
          SQLITE_OMIT_TRACE: null
          SQLITE_USE_ALLOCA: null
          SQLITE_ENABLE_SESSION: null
          SQLITE_ENABLE_PREUPDATE_HOOK: null
          SQLITE_UNTESTABLE: null
          SQLITE_HAVE_ISNAN: null
          SQLITE_HAVE_LOCALTIME_R: null
          SQLITE_HAVE_LOCALTIME_S: null
          SQLITE_HAVE_MALLOC_USABLE_SIZE: null
          SQLITE_HAVE_STRCHRNUL: null
          SQLITE_API: '__declspec(dllexport)'
# END ASTORIA PINNED SQLITE SOURCE HOOK
